version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Redis 1.x requires Rust 1.85 or newer; 0.32.7 supports Rust 1.80.
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
      # sha1 0.11 requires Rust 1.85. Keep accepting compatible 0.10 patches.
      - dependency-name: sha1
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # Clap 4.5.58+ selects an Edition 2024 lexer that Cargo 1.81 cannot parse.
      - dependency-name: clap
        versions: [">= 4.5.58"]
      # Clap Complete 4.5 remains compatible; 4.6 follows the newer toolchain line.
      - dependency-name: clap_complete
        versions: [">= 4.6.0"]
      # URL 2.5.4+ selects the newer ICU graph whose manifests use Edition 2024.
      - dependency-name: url
        versions: [">= 2.5.4"]
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-build:
        patterns: ["maturin", "ruff"]
      python-integrations:
        patterns: ["datasketch", "datasets", "polars", "pyarrow"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      workflow-pins:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
