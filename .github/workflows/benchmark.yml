name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  benchmark:
    name: Release benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PARI_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: End-to-end benchmark
        run: |
          cargo run --release -p pari-bench -- run \
            --items 10000 \
            --queries 100 \
            --output benchmark-results.json
      - name: Persistent storage benchmark
        run: |
          cargo run --release -p pari-bench -- storage \
            --items 10000 \
            --queries 100 \
            --output storage-results.json
      - name: Storage layout shootout
        run: |
          cargo run --release \
            --manifest-path benchmarks/criterion/Cargo.toml \
            --bin storage_layout \
            -- --items 5000 --queries 200 --output storage-layout-results.json
      - name: Criterion microbenchmarks
        run: cargo bench --manifest-path benchmarks/criterion/Cargo.toml
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pari-benchmarks-${{ github.sha }}
          if-no-files-found: error
          path: |
            benchmark-results.json
            storage-results.json
            storage-layout-results.json
            benchmarks/criterion/target/criterion
