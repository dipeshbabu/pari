name: Release Validation

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "crates/**/Cargo.toml"
      - "scripts/release.py"
      - "CHANGELOG.md"
      - "docs/compatibility.md"
      - "docs/releasing.md"
      - "docs/releases/**"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"
  MATURIN_VERSION: "1.14.1"

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - id: version
        name: Read authoritative version
        shell: bash
        run: echo "value=$(python scripts/release.py version)" >> "$GITHUB_OUTPUT"
      - name: Validate release metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python scripts/release.py validate --tag "$GITHUB_REF_NAME"
          else
            python scripts/release.py validate
          fi
      - name: Generate CycloneDX SBOM
        run: python scripts/release.py sbom --output release-metadata/pari-${{ steps.version.outputs.value }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-metadata
          if-no-files-found: error

  rust-packages:
    name: Rust package validation
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Validate public package metadata
        run: python scripts/release.py validate
      - name: Package dependency-root crates
        run: |
          cargo package --locked -p pari-core
          cargo package --locked -p pari-format
      - name: Package dependent crates after registry bootstrap
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cargo package --locked -p pari-index
          cargo package --locked -p pari-store
      - uses: actions/upload-artifact@v4
        with:
          name: rust-crates
          path: target/package/*.crate
          if-no-files-found: error

  python-wheels:
    name: Python wheel ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install maturin
        run: python -m pip install "maturin==${{ env.MATURIN_VERSION }}"
      - name: Build wheel
        run: maturin build --release --out dist
      - name: Install built wheel
        run: python python/tests/install_wheel.py dist
      - name: Test installed package
        run: python -m unittest discover -s python/tests -p "test_*.py" -v
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

  python-sdist:
    name: Python source distribution
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install maturin
        run: python -m pip install "maturin==${{ env.MATURIN_VERSION }}"
      - name: Build source distribution
        run: maturin sdist --out dist
      - name: Install source distribution
        run: python -m pip install --force-reinstall dist/*.tar.gz
      - name: Smoke installed source distribution outside checkout
        working-directory: ${{ runner.temp }}
        run: python -c "from pari import MinHash; print(MinHash.from_values([b'release'], num_perm=16, seed=7))"
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  cli:
    name: CLI ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            binary: target/release/pari
          - os: macos-latest
            label: macos
            binary: target/release/pari
          - os: windows-latest
            label: windows
            binary: target/release/pari.exe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Build CLI
        run: cargo build --locked --release -p pari-cli
      - name: Smoke CLI
        run: ${{ matrix.binary }} --help
      - name: Package CLI
        run: >-
          python scripts/release.py package-cli
          --binary "${{ matrix.binary }}"
          --output-dir release-cli
          --platform "${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.label }}
          path: release-cli/*
          if-no-files-found: error

  assemble:
    name: Assemble release candidate
    runs-on: ubuntu-latest
    needs: [metadata, rust-packages, python-wheels, python-sdist, cli]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: "*"
          path: release-dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: >-
          python scripts/release.py checksums
          --directory release-dist
          --output release-dist/SHA256SUMS
      - name: Validate assembled artifact set
        shell: bash
        run: |
          test -n "$(find release-dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$(find release-dist -maxdepth 1 -name '*.crate' -print -quit)"
          test -n "$(find release-dist -maxdepth 1 \( -name '*.zip' -o -name '*.tar.gz' \) -print -quit)"
          test -f "release-dist/pari-${{ needs.metadata.outputs.version }}.cdx.json"
          test -s release-dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release-dist
          if-no-files-found: error

  attest:
    name: Attest release artifacts
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: assemble
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-bundle
          path: release-dist
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "release-dist/*"

  verify-bootstrap:
    name: Verify 0.1.0 crates.io bootstrap
    if: startsWith(github.ref, 'refs/tags/') && needs.metadata.outputs.version == '0.1.0'
    runs-on: ubuntu-latest
    needs: [metadata, rust-packages]
    steps:
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Verify public crates are visible
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          for crate in pari-core pari-format pari-index pari-store; do
            cargo info "$crate@$VERSION" >/dev/null || {
              echo "$crate $VERSION is not visible on crates.io. Complete the documented first-release bootstrap before tagging." >&2
              exit 1
            }
          done

  publish-crates:
    name: Publish Rust crates with trusted publishing
    if: startsWith(github.ref, 'refs/tags/') && needs.metadata.outputs.version != '0.1.0'
    runs-on: ubuntu-latest
    needs: [metadata, rust-packages]
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish public crates in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          wait_for_crate() {
            local crate="$1"
            for attempt in $(seq 1 30); do
              if cargo info "$crate@$VERSION" >/dev/null 2>&1; then
                return 0
              fi
              sleep 10
            done
            echo "timed out waiting for $crate $VERSION in crates.io index" >&2
            return 1
          }

          cargo publish --locked -p pari-core
          wait_for_crate pari-core
          cargo publish --locked -p pari-format
          wait_for_crate pari-format
          cargo publish --locked -p pari-index
          wait_for_crate pari-index
          cargo publish --locked -p pari-store

  publish-pypi:
    name: Publish Python distribution
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [metadata, python-wheels, python-sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/pari-similarity
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: "python-*"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') &&
      needs.assemble.result == 'success' &&
      needs.publish-pypi.result == 'success' &&
      (needs.verify-bootstrap.result == 'success' || needs.verify-bootstrap.result == 'skipped') &&
      (needs.publish-crates.result == 'success' || needs.publish-crates.result == 'skipped') &&
      needs.attest.result == 'success'
    runs-on: ubuntu-latest
    needs: [metadata, assemble, verify-bootstrap, publish-crates, publish-pypi, attest]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release-bundle
          path: release-dist
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-dist/*
          --verify-tag
          --title "Pari $VERSION alpha"
          --notes-file "docs/releases/$VERSION.md"
