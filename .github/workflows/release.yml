name: Release Validation

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "crates/**/Cargo.toml"
      - "crates/**/LICENSE"
      - "crates/**/NOTICE"
      - "crates/pari-core/src/minhash.rs"
      - "crates/pari-core/testdata/**"
      - "benchmarks/datasketch_interop.py"
      - "benchmarks/similarity_family_evaluation.py"
      - "examples/code_workload.py"
      - "examples/code_corpus_fixture/**"
      - "examples/entity_matching.py"
      - "examples/entity_matching_fixture/**"
      - "examples/text_workload.py"
      - "python/pari/**"
      - "python/tests/**"
      - "docs/code-workloads.md"
      - "docs/datasketch-v2.md"
      - "docs/dataset-integrations.md"
      - "docs/entity-matching.md"
      - "docs/observability.md"
      - "docs/parallelism.md"
      - "docs/planning.md"
      - "docs/similarity-family-evaluation.md"
      - "docs/text-workloads.md"
      - "scripts/generate_datasketch_v2_golden.py"
      - "scripts/release.py"
      - "scripts/tests/**"
      - "CHANGELOG.md"
      - "docs/compatibility.md"
      - "docs/releasing.md"
      - "docs/releases/**"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.97.1"
  MATURIN_VERSION: "1.14.1"

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Test release tooling
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v
      - id: version
        name: Read authoritative version
        shell: bash
        run: echo "value=$(python scripts/release.py version)" >> "$GITHUB_OUTPUT"
      - name: Validate release metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python scripts/release.py validate --tag "$GITHUB_REF_NAME"
          else
            python scripts/release.py validate
          fi
      - name: Generate CycloneDX SBOM
        run: python scripts/release.py sbom --output release-metadata/pari-${{ steps.version.outputs.value }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release-metadata
          if-no-files-found: error

  rust-packages:
    name: Rust package validation
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Validate public package metadata
        run: python scripts/release.py validate
      - name: Package dependency-root crates
        run: |
          cargo package --locked -p pari-core
          cargo package --locked -p pari-format
      - name: Verify packaged dependency-root licenses and attribution
        run: |
          cargo package --locked -p pari-core --list --no-verify | grep -Fx LICENSE
          cargo package --locked -p pari-core --list --no-verify | grep -Fx NOTICE
          cargo package --locked -p pari-format --list --no-verify | grep -Fx LICENSE
      - name: Package dependent crates from the published dependency set
        run: |
          cargo package --locked -p pari-index
          cargo package --locked -p pari-store
      - name: Verify packaged dependent licenses and attribution
        run: |
          cargo package --locked -p pari-index --list --no-verify | grep -Fx LICENSE
          cargo package --locked -p pari-index --list --no-verify | grep -Fx NOTICE
          cargo package --locked -p pari-store --list --no-verify | grep -Fx LICENSE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-crates
          path: target/package/*.crate
          if-no-files-found: error

  verify-crates-oidc:
    name: Verify crates.io trusted publisher
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Confirm a temporary token was issued
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: test -n "$CARGO_REGISTRY_TOKEN"

  python-wheels:
    name: Python wheel ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            label: linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Build manylinux2014 wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --locked --out dist
          maturin-version: ${{ env.MATURIN_VERSION }}
          manylinux: "2014"
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: runner.os != 'Linux'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install maturin
        if: runner.os != 'Linux'
        run: python -m pip install "maturin==${{ env.MATURIN_VERSION }}"
      - name: Build native wheel
        if: runner.os != 'Linux'
        run: maturin build --release --locked --out dist
      - name: Install built wheel
        if: matrix.label != 'linux-arm64'
        run: python python/tests/install_wheel.py dist
      - name: Test installed package
        if: matrix.label != 'linux-arm64'
        run: python -m unittest discover -s python/tests -p "test_*.py" -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

  python-arm64-validation:
    name: Python wheel linux-arm64 validation
    runs-on: ubuntu-24.04-arm
    needs: [metadata, python-wheels]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-wheel-linux-arm64
          path: dist
      - name: Install cross-built wheel on native arm64
        run: python python/tests/install_wheel.py dist
      - name: Run focused native arm64 smoke
        run: python python/tests/arm64_smoke.py
      - name: Test installed package
        run: python -m unittest discover -s python/tests -p "test_*.py" -v

  python-sdist:
    name: Python source distribution
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # scripts/release.py intentionally uses stdlib tomllib (Python 3.11+).
          # CPython 3.10 package compatibility is covered by the wheel matrices.
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install maturin
        run: python -m pip install "maturin==${{ env.MATURIN_VERSION }}"
      - name: Build source distribution
        run: maturin sdist --out dist
      - name: Verify complete source distribution manifest
        shell: bash
        run: |
          archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          python scripts/release.py validate-sdist --archive "$archive"
      - name: Install source distribution
        run: python -m pip install --force-reinstall dist/*.tar.gz
      - name: Smoke installed source distribution outside checkout
        working-directory: ${{ runner.temp }}
        run: python -c "from pari import MinHash; print(MinHash.from_values([b'release'], num_perm=16, seed=7))"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  cli:
    name: CLI ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            binary: target/release/pari
          - os: ubuntu-24.04-arm
            label: linux-arm64
            binary: target/release/pari
          - os: macos-latest
            label: macos
            binary: target/release/pari
          - os: windows-latest
            label: windows
            binary: target/release/pari.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Build CLI
        run: cargo build --locked --release -p pari-cli
      - name: Run native Linux arm64 CLI smoke
        if: matrix.label == 'linux-arm64'
        shell: bash
        run: |
          test "$(uname -m)" = aarch64
          target/release/pari --version
          target/release/pari --help >/dev/null
          printf '%s\n' \
            '{"key":1,"values":["arm64","pari","release"]}' \
            '{"key":2,"values":["arm64","pari","validation"]}' \
            > arm64-input.jsonl
          target/release/pari index \
            --input arm64-input.jsonl \
            --output arm64-smoke.pari \
            --num-perm 32 \
            --json
          target/release/pari verify --index arm64-smoke.pari --json
      - id: source-date
        name: Read source date epoch
        shell: bash
        run: echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - name: Package and validate CLI
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source-date.outputs.value }}
        run: >-
          python scripts/release.py package-cli
          --binary "${{ matrix.binary }}"
          --output-dir release-cli
          --platform "${{ matrix.label }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.label }}
          path: release-cli/*
          if-no-files-found: error

  assemble:
    name: Assemble release candidate
    runs-on: ubuntu-latest
    needs: [metadata, rust-packages, python-wheels, python-arm64-validation, python-sdist, cli]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*"
          path: release-dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: >-
          python scripts/release.py checksums
          --directory release-dist
          --output release-dist/SHA256SUMS
      - name: Validate assembled artifact set
        shell: bash
        run: |
          version="${{ needs.metadata.outputs.version }}"
          test -n "$(find release-dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -f "release-dist/pari_similarity-$version.tar.gz"
          for crate in pari-core pari-format pari-index pari-store; do
            test -f "release-dist/$crate-$version.crate"
          done
          test -f "release-dist/pari-$version-linux.tar.gz"
          test -f "release-dist/pari-$version-linux-arm64.tar.gz"
          test -f "release-dist/pari-$version-macos.tar.gz"
          test -f "release-dist/pari-$version-windows.zip"
          test -f "release-dist/pari-$version.cdx.json"
          test -s release-dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-bundle
          path: release-dist
          if-no-files-found: error

  attest:
    name: Attest release artifacts
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: publish-crates
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release-dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release-dist/*"

  verify-bootstrap:
    name: Verify 0.1.0 crates.io bootstrap
    if: startsWith(github.ref, 'refs/tags/') && needs.metadata.outputs.version == '0.1.0'
    runs-on: ubuntu-latest
    needs: [metadata, rust-packages]
    steps:
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Verify public crates are visible
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          for crate in pari-core pari-format pari-index pari-store; do
            cargo info "$crate@$VERSION" >/dev/null || {
              echo "$crate $VERSION is not visible on crates.io. Complete the documented first-release bootstrap before tagging." >&2
              exit 1
            }
          done

  publish-crates:
    name: Publish Rust crates with trusted publishing
    if: startsWith(github.ref, 'refs/tags/') && needs.metadata.outputs.version != '0.1.0'
    runs-on: ubuntu-latest
    needs: [metadata, rust-packages, assemble]
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish public crates in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          wait_for_crate() {
            local crate="$1"
            for attempt in $(seq 1 30); do
              if cargo info "$crate@$VERSION" >/dev/null 2>&1; then
                return 0
              fi
              sleep 10
            done
            echo "timed out waiting for $crate $VERSION in crates.io index" >&2
            return 1
          }

          cargo publish --locked -p pari-core
          wait_for_crate pari-core
          cargo publish --locked -p pari-format
          wait_for_crate pari-format
          cargo publish --locked -p pari-index
          wait_for_crate pari-index
          cargo publish --locked -p pari-store
          wait_for_crate pari-store

          # All packages can be registry-verified only after the coordinated
          # exact-version dependency set has reached the index.
          cargo package --locked -p pari-core
          cargo package --locked -p pari-format
          cargo package --locked -p pari-index
          cargo package --locked -p pari-store
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-bundle
          path: release-dist
      - name: Assemble the complete published release bundle
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          cp target/package/*.crate release-dist/
          python scripts/release.py checksums \
            --directory release-dist \
            --output release-dist/SHA256SUMS
          test -n "$(find release-dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -f "release-dist/pari_similarity-$VERSION.tar.gz"
          for crate in pari-core pari-format pari-index pari-store; do
            test -f "release-dist/$crate-$VERSION.crate"
          done
          test -f "release-dist/pari-$VERSION-linux.tar.gz"
          test -f "release-dist/pari-$VERSION-linux-arm64.tar.gz"
          test -f "release-dist/pari-$VERSION-macos.tar.gz"
          test -f "release-dist/pari-$VERSION-windows.zip"
          test -f "release-dist/pari-$VERSION.cdx.json"
          test -s release-dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: release-dist
          if-no-files-found: error

  publish-pypi:
    name: Publish Python distribution
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') &&
      needs.metadata.result == 'success' &&
      needs.python-wheels.result == 'success' &&
      needs.python-sdist.result == 'success' &&
      (needs.verify-bootstrap.result == 'success' || needs.publish-crates.result == 'success')
    runs-on: ubuntu-latest
    needs: [metadata, python-wheels, python-sdist, verify-bootstrap, publish-crates]
    environment:
      name: pypi
      url: https://pypi.org/p/pari-similarity
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "python-*"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    name: Create GitHub Release
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') &&
      needs.assemble.result == 'success' &&
      needs.publish-pypi.result == 'success' &&
      (needs.verify-bootstrap.result == 'success' || needs.verify-bootstrap.result == 'skipped') &&
      (needs.publish-crates.result == 'success' || needs.publish-crates.result == 'skipped') &&
      needs.attest.result == 'success'
    runs-on: ubuntu-latest
    needs: [metadata, assemble, verify-bootstrap, publish-crates, publish-pypi, attest]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release-dist
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-dist/*
          --verify-tag
          --prerelease
          --title "Pari $VERSION alpha"
          --notes-file "docs/releases/$VERSION.md"
