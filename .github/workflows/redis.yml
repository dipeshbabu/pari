name: Redis

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"
  PARI_REDIS_URL: "redis://127.0.0.1:6379/"
  PARI_REDIS_BENCH_ITEMS: "1000"
  PARI_REDIS_BENCH_QUERIES: "100"
  PARI_REDIS_BENCH_OUTPUT: "redis-backend-benchmark.json"

jobs:
  redis-backend:
    name: Redis backend
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.2-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf # 7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Run Redis backend tests
        run: cargo test -p pari-backend --features redis --all-targets
      - name: Run Redis batch benchmark smoke
        run: cargo run --release -p pari-backend --example redis_bench --features redis
      - name: Show Redis benchmark report
        run: cat redis-backend-benchmark.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redis-backend-benchmark
          path: redis-backend-benchmark.json
          if-no-files-found: error
