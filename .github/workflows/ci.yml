name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path benchmarks/criterion/Cargo.toml --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --manifest-path benchmarks/criterion/Cargo.toml --all-targets -- -D warnings

  msrv:
    name: Rust 1.81 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.81.0"
      - name: Check published crates with the locked dependency graph
        run: >-
          cargo check --locked
          -p pari-core
          -p pari-format
          -p pari-index
          -p pari-store
      - name: Verify published crate packages
        run: |
          cargo package --locked -p pari-core
          cargo package --locked -p pari-format
          cargo package --locked -p pari-index
          # pari-store uses post-0.1 pari-index APIs; registry verification becomes
          # possible again when #91 publishes the coordinated 0.2 dependency set.
          cargo package --locked --no-verify -p pari-store

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo test --manifest-path benchmarks/criterion/Cargo.toml --all-targets
      - run: python -m unittest scripts.tests.test_benchmark_campaign -v

  storage-layout-smoke:
    name: Storage layout smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: |
          cargo run --release \
            --manifest-path benchmarks/criterion/Cargo.toml \
            --bin storage_layout \
            -- --items 256 --queries 32 --output storage-layout-smoke.json

  windows-storage-smoke:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test --workspace --all-targets --all-features
