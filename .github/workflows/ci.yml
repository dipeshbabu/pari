name: CI

on:
  push:
    branches: [main, "maintenance/*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_DENY_VERSION: "0.20.2"
  RUFF_VERSION: "0.17.6"
  PRE_COMMIT_VERSION: "4.6.2"
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path benchmarks/criterion/Cargo.toml --all -- --check
      - name: Install reviewed Ruff version
        run: python -m pip install "ruff==${RUFF_VERSION}"
      - name: Check Python formatting
        run: ruff format --check python scripts benchmarks examples
      - name: Lint Python
        run: ruff check python scripts benchmarks examples
      - run: python scripts/check_workflow_pins.py
      - run: python -m pip install "pre-commit==${PRE_COMMIT_VERSION}"
      - run: python -m pre_commit run --all-files --show-diff-on-failure
      - run: python scripts/check_precommit_samples.py

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --manifest-path benchmarks/criterion/Cargo.toml --all-targets -- -D warnings

  msrv:
    name: Rust 1.81 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.81.0"
      - name: Check the Rust 1.81 workspace set with the locked dependency graph
        run: >-
          cargo check --locked --workspace --all-features
          --exclude pari-py
      - name: Check the CLI and Redis graph explicitly
        run: |
          cargo check --locked -p pari-cli
          cargo check --locked -p pari-backend --features redis
      - name: Check the Criterion workspace
        run: >-
          cargo check --locked
          --manifest-path benchmarks/criterion/Cargo.toml
          --all-targets
      - name: Verify published crate packages
        run: |
          cargo package --locked -p pari-core
          cargo package --locked -p pari-format
          # Exact registry dependencies are unavailable before publication.
          # Check package contents here; publish verifies tarballs in order.
          cargo package --locked -p pari-index --list --no-verify
          cargo package --locked -p pari-store --list --no-verify
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.83.0"
      - name: Check the security-constrained Python binding MSRV
        run: cargo +1.83.0 check --locked -p pari-py

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - id: cargo-deny-cache
        name: Restore reviewed cargo-deny binary
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: >-
            cargo-deny-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install reviewed cargo-deny version
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version "${CARGO_DENY_VERSION}" --locked
      - name: Report reviewed cargo-deny version
        run: cargo deny --version
      - run: cargo deny check advisories licenses bans sources
      - name: Save reviewed cargo-deny binary
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.cargo-deny-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ steps.cargo-deny-cache.outputs.cache-primary-key }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo test --manifest-path benchmarks/criterion/Cargo.toml --all-targets
      - run: python -m unittest scripts.tests.test_benchmark_campaign -v

  performance:
    name: Performance regression
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Test the regression check
        run: python3 -m unittest scripts.tests.test_check_performance -v
      - name: Compare small benchmarks with the pull request base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci_performance.sh "$BASE_SHA"

  storage-layout-smoke:
    name: Storage layout smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: |
          cargo run --release \
            --manifest-path benchmarks/criterion/Cargo.toml \
            --bin storage_layout \
            -- --items 256 --queries 32 --output storage-layout-smoke.json

  dedicated-scale-script-smoke:
    name: Dedicated scale script smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run the dedicated-host script with the smoke profile
        env:
          PARI_SCALE_PROFILES: smoke
          PARI_SCALE_MIN_MEMORY_GIB: "1"
          PARI_SCALE_MIN_FREE_DISK_GIB: "5"
          PARI_SCALE_DEDUPE_ITEMS: "2000"
        run: bash scripts/run_dedicated_scale.sh "$RUNNER_TEMP/scale-run"
      - name: Check the hand-back archive
        run: |
          cd "$RUNNER_TEMP/scale-run"
          sha256sum -c pari-scale-evidence-*.tar.gz.sha256
          tar -tzf pari-scale-evidence-*.tar.gz | grep -E '/smoke/bundle.json$'
          tar -tzf pari-scale-evidence-*.tar.gz | grep -E '/host.txt$'
          for backend in memory local; do
            tar -xzOf pari-scale-evidence-*.tar.gz --wildcards "*/dedupe-$backend.json"               | python3 -c 'import json, sys; r = json.load(sys.stdin)["result"]; assert r["items"] == 2000 and 0 < r["groups"] <= 1000 and r["grouped_members"] == 2 * r["groups"] and r["peak_rss_bytes"] > 0, r; print(r)'
          done

  windows-storage-smoke:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test --workspace --all-targets --all-features
      - name: Test campaign process cleanup on Windows
        run: python -m unittest scripts.tests.test_benchmark_campaign -v
