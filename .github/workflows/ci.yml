name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_DENY_VERSION: "0.20.2"
  RUFF_VERSION: "0.16.5"
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path benchmarks/criterion/Cargo.toml --all -- --check
      - name: Install reviewed Ruff version
        run: python -m pip install "ruff==${RUFF_VERSION}"
      - name: Check Python formatting
        run: ruff format --check python scripts benchmarks examples
      - name: Lint Python
        run: ruff check python scripts benchmarks examples
      - run: python scripts/check_workflow_pins.py

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --manifest-path benchmarks/criterion/Cargo.toml --all-targets -- -D warnings

  msrv:
    name: Rust 1.81 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.81.0"
      - name: Check published crates with the locked dependency graph
        run: >-
          cargo check --locked
          -p pari-core
          -p pari-format
          -p pari-index
          -p pari-store
      - name: Verify published crate packages
        run: |
          cargo package --locked -p pari-core
          cargo package --locked -p pari-format
          cargo package --locked -p pari-index
          # pari-store now consumes affine64 symbols added to the local
          # pari-index graph after 0.2.0. Build its tarball without registry
          # verification until the coordinated matching release is published.
          cargo package --locked -p pari-store --no-verify

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - id: cargo-deny-cache
        name: Restore reviewed cargo-deny binary
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: >-
            cargo-deny-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install reviewed cargo-deny version
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version "${CARGO_DENY_VERSION}" --locked
      - name: Report reviewed cargo-deny version
        run: cargo deny --version
      - run: cargo deny check advisories licenses bans sources
      - name: Save reviewed cargo-deny binary
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.cargo-deny-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ steps.cargo-deny-cache.outputs.cache-primary-key }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo test --manifest-path benchmarks/criterion/Cargo.toml --all-targets
      - run: python -m unittest scripts.tests.test_benchmark_campaign -v

  storage-layout-smoke:
    name: Storage layout smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: |
          cargo run --release \
            --manifest-path benchmarks/criterion/Cargo.toml \
            --bin storage_layout \
            -- --items 256 --queries 32 --output storage-layout-smoke.json

  windows-storage-smoke:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test --workspace --all-targets --all-features
