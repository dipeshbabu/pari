name: Python

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"
  MATURIN_VERSION: "1.14.1"

jobs:
  wheel-platforms:
    name: Wheel ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install maturin
        run: python -m pip install "maturin==${{ env.MATURIN_VERSION }}"
      - name: Build wheel
        run: maturin build --release --out dist
      - name: Install built wheel
        run: python python/tests/install_wheel.py dist
      - name: Test installed package
        run: python -m unittest discover -s python/tests -p "test_*.py" -v

  python-versions:
    name: CPython ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install maturin
        run: python -m pip install "maturin==${{ env.MATURIN_VERSION }}"
      - name: Build abi3 wheel
        run: maturin build --release --out dist
      - name: Install built wheel
        run: python python/tests/install_wheel.py dist
      - name: Test installed package
        run: python -m unittest discover -s python/tests -p "test_*.py" -v

  datasketch-interop:
    name: Datasketch 2.0 interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install build and optional interoperability dependencies
        run: >-
          python -m pip install
          "maturin==${{ env.MATURIN_VERSION }}"
          "datasketch==2.0.0"
      - name: Build wheel
        run: maturin build --release --out dist
      - name: Install built wheel
        run: python python/tests/install_wheel.py dist
      - name: Run cross-implementation golden tests
        run: python -m unittest python.tests.test_datasketch_interop -v
      - name: Run semantics-first migration benchmark smoke test
        run: >-
          python benchmarks/datasketch_interop.py
          --items 64
          --queries 8
          --set-size 20
          --num-perm 64
          --output datasketch-interop.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datasketch-interop-smoke
          path: datasketch-interop.json
          if-no-files-found: error

  dataset-integrations:
    name: PyArrow, Polars, and Hugging Face integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install build and optional dataset dependencies
        run: >-
          python -m pip install
          "maturin==${{ env.MATURIN_VERSION }}"
          "pyarrow>=18,<27"
          "polars>=1.36,<2"
          "datasets>=3.5,<6"
      - name: Build wheel
        run: maturin build --release --out dist
      - name: Install built wheel
        run: python python/tests/install_wheel.py dist
      - name: Run dataset integration tests
        run: python -m unittest python.tests.test_integrations -v
