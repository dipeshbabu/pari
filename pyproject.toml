[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "pari-similarity"
dynamic = ["version"]
description = "Fast, persistent approximate similarity search powered by Rust"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Dipesh Babu" },
]
keywords = ["minhash", "lsh", "similarity", "deduplication", "rust"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Typing :: Typed",
]

[project.optional-dependencies]
datasketch = ["datasketch>=2,<3"]
pyarrow = ["pyarrow>=18,<27"]
polars = ["polars>=1.36,<2"]
huggingface = ["datasets>=3.5,<6"]
integrations = ["pyarrow>=18,<27", "polars>=1.36,<2", "datasets>=3.5,<6"]

[dependency-groups]
dev = ["ruff==0.16.5"]

[project.urls]
Repository = "https://github.com/dipeshbabu/pari"
Issues = "https://github.com/dipeshbabu/pari/issues"

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
  "*.md",
  "examples/code_corpus_fixture/**",
]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "PERF",
  "PIE",
  "PLE",
  "PLW",
  "RET",
  "S",
  "SIM",
  "TRY002",
  "TRY004",
  "TRY201",
  "TRY300",
  "TRY400",
  "TRY401",
  "RUF005",
  "RUF006",
  "RUF010",
  "RUF012",
  "RUF015",
  "RUF018",
  "RUF019",
  "RUF022",
  "RUF024",
]
ignore = ["PERF203"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/similarity_family_evaluation.py" = ["E402"]
"examples/text_workload.py" = ["S608"]
"python/tests/install_wheel.py" = ["S603"]
"scripts/benchmark_campaign.py" = ["S603"]
"scripts/check_precommit_samples.py" = ["S603"]
"scripts/parallel_benchmark.py" = ["S603"]
"scripts/release.py" = ["S603", "S607"]
"scripts/tests/test_parallel_benchmark.py" = ["B017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = false

[tool.maturin]
manifest-path = "crates/pari-py/Cargo.toml"
module-name = "pari._native"
python-source = "python"
bindings = "pyo3"
strip = true
include = [
  { path = "LICENSE", format = "sdist" },
  { path = "NOTICE", format = "sdist" },
  { path = "benchmarks/datasketch_interop.py", format = "sdist" },
  { path = "benchmarks/similarity_family_evaluation.py", format = "sdist" },
  { path = "docs/datasketch-v2.md", format = "sdist" },
  { path = "docs/benchmarks.md", format = "sdist" },
  { path = "docs/dataset-integrations.md", format = "sdist" },
  { path = "docs/code-workloads.md", format = "sdist" },
  { path = "docs/entity-matching.md", format = "sdist" },
  { path = "docs/observability.md", format = "sdist" },
  { path = "docs/planning.md", format = "sdist" },
  { path = "docs/python.md", format = "sdist" },
  { path = "docs/similarity-family-evaluation.md", format = "sdist" },
  { path = "docs/parallelism.md", format = "sdist" },
  { path = "docs/platforms.md", format = "sdist" },
  { path = "docs/text-workloads.md", format = "sdist" },
  { path = "examples/text_workload.py", format = "sdist" },
  { path = "examples/code_workload.py", format = "sdist" },
  { path = "examples/code_corpus_fixture/repo-alpha/src/checksum.py", format = "sdist" },
  { path = "examples/code_corpus_fixture/repo-beta/lib/checksum_copy.py", format = "sdist" },
  { path = "examples/code_corpus_fixture/repo-beta/src/clamp.rs", format = "sdist" },
  { path = "examples/entity_matching.py", format = "sdist" },
  { path = "examples/entity_matching_fixture/customers.jsonl", format = "sdist" },
  { path = "examples/entity_matching_fixture/products.jsonl", format = "sdist" },
  { path = "scripts/generate_datasketch_v2_golden.py", format = "sdist" },
]
