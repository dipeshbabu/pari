[package]
name = "pari-criterion"
version = "0.0.0"
edition = "2021"
rust-version = "1.81"
publish = false

[workspace]

[dependencies]
memmap2 = "0.9.11"
pari-core = { path = "../../crates/pari-core" }
pari-index = { path = "../../crates/pari-index" }
# redb 3+ requires newer Rust; 2.4 is the maintained Rust-1.81-compatible line.
redb = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Criterion's broad transitive constraint otherwise resolves Clap 4.6, whose
# Edition 2024 lexer cannot be parsed by Cargo 1.81.
clap = "=4.5.57"
criterion = "0.5.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[[bench]]
name = "core"
harness = false
