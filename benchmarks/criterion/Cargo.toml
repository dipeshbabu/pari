[package]
name = "pari-criterion"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
memmap2 = "0.9.11"
pari-core = { path = "../../crates/pari-core" }
pari-index = { path = "../../crates/pari-index" }
redb = "4.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = "0.5.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[[bench]]
name = "core"
harness = false
