[package]
name = "pari-backend"
description = "Pluggable shared storage backends for Pari similarity indexes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
conformance = []
redis = ["dep:redis", "conformance"]

[dependencies]
pari-core = { path = "../pari-core" }
pari-format = { path = "../pari-format" }
pari-index = { path = "../pari-index" }
redis = { version = "=0.32.7", optional = true, default-features = false }

[dev-dependencies]
pari-bench = { path = "../pari-bench" }

[[example]]
name = "redis_bench"
required-features = ["redis"]

[[test]]
name = "backend_contract"
required-features = ["conformance"]

[lints]
workspace = true
