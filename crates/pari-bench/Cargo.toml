[package]
name = "pari-bench"
default-run = "pari-bench"
description = "Reproducible end-to-end benchmark harness for Pari"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
pari-core = { path = "../pari-core" }
pari-index = { path = "../pari-index" }
pari-store = { path = "../pari-store" }
pari-store-build = { path = "../pari-store-build" }
pari-store-lazy = { path = "../pari-store-lazy" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
