[package]
name = "pari-cli"
description = "Command-line workflows for the Pari similarity engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "pari"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
pari-core = { path = "../pari-core" }
pari-format = { path = "../pari-format" }
pari-index = { path = "../pari-index" }
pari-store = { path = "../pari-store" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
same-file = "1.0"

[lints]
workspace = true
